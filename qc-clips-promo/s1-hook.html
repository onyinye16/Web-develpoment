<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="kit.css">
<style>
  #world{position:absolute;inset:0;transform-origin:820px 1232px}
  #salon{position:absolute;inset:0;width:1080px;height:1920px}
  .lock{background:radial-gradient(500px 400px at 80% 0%,rgba(232,168,18,.35),transparent 60%),linear-gradient(170deg,#1E6B54,#0E3B2E 45%,#061a14);color:#fff}
  .lock .sbar{color:#fff}
  .clock{position:absolute;top:170px;left:0;right:0;text-align:center}
  .clock small{display:block;font-size:34px;font-weight:600;opacity:.85}
  .clock b{display:block;font-size:190px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .badge{position:absolute;right:-26px;top:-26px;min-width:84px;height:84px;padding:0 20px;border-radius:42px;background:#E5484D;color:#fff;font-size:44px;font-weight:800;display:grid;place-items:center;box-shadow:0 10px 30px rgba(229,72,77,.5);z-index:5}
  .unread{position:absolute;left:0;right:0;text-align:center;font-size:28px;font-weight:700;color:rgba(255,255,255,.75)}
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div id="world">
  <svg id="salon" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
      <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a5a4a" stop-opacity=".55"/><stop offset="1" stop-color="#0b2a20" stop-opacity=".2"/></linearGradient>
      <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFE7D8"/><stop offset="1" stop-color="#CFC3AE"/></linearGradient>
      <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E3B2E"/><stop offset="1" stop-color="#041510"/></linearGradient>
      <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E6B54"/><stop offset="1" stop-color="#0B3226"/></linearGradient>
      <radialGradient id="hair" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#3a2416"/><stop offset="1" stop-color="#120905"/></radialGradient>
    </defs>
    <!-- warm salon lights -->
    <g filter="url(#soft)" fill="#F4CF6A">
      <circle cx="140" cy="520" r="60" opacity=".35"/><circle cx="930" cy="600" r="80" opacity=".28"/><circle cx="700" cy="460" r="40" opacity=".4"/><circle cx="420" cy="420" r="70" opacity=".22"/><circle cx="1000" cy="900" r="50" opacity=".25"/>
    </g>
    <!-- mirror -->
    <path d="M90 1520 V800 A260 260 0 0 1 610 800 V1520 Z" fill="url(#mirror)" stroke="#E8A812" stroke-width="10" stroke-opacity=".85"/>
    <path d="M150 760 Q200 640 320 600" stroke="#fff" stroke-opacity=".18" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- client: cape, head, braids -->
    <path d="M110 1640 C130 1320 230 1200 350 1190 C470 1200 570 1320 590 1640 Z" fill="url(#cape)"/>
    <path d="M280 1200 Q350 1235 420 1200" stroke="#E8A812" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="350" cy="1050" rx="128" ry="146" fill="url(#hair)"/>
    <g stroke="#5a3a26" stroke-width="4" fill="none" opacity=".8"><path d="M350 905 V1180"/><path d="M290 925 Q300 1050 290 1170"/><path d="M410 925 Q400 1050 410 1170"/></g>
    <g id="braids" stroke-linecap="round" fill="none">
      <path d="M262 1110 C250 1250 240 1380 236 1520" stroke="#24150c" stroke-width="26"/>
      <path d="M262 1110 C250 1250 240 1380 236 1520" stroke="#4a3020" stroke-width="16" stroke-dasharray="14 10"/>
      <path d="M300 1150 C292 1290 286 1420 284 1560" stroke="#24150c" stroke-width="26"/>
      <path d="M300 1150 C292 1290 286 1420 284 1560" stroke="#4a3020" stroke-width="16" stroke-dasharray="14 10"/>
      <path d="M338 1170 C334 1300 332 1430 332 1570" stroke="#24150c" stroke-width="26"/>
      <path d="M338 1170 C334 1300 332 1430 332 1570" stroke="#4a3020" stroke-width="16" stroke-dasharray="14 10"/>
    </g>
    <!-- strands being braided, ends follow the hands -->
    <g stroke="#2a1a10" stroke-width="7" fill="none" stroke-linecap="round">
      <path id="strandA"/><path id="strandB"/>
    </g>
    <!-- stylist's arms and hands -->
    <g id="armA"><path class="sleeve" stroke="#111814" stroke-width="72" stroke-linecap="round" fill="none"/><g class="hand"><ellipse cx="-34" cy="6" rx="50" ry="38" fill="#7A4A2E"/><rect x="-118" y="-26" width="76" height="20" rx="10" fill="#8A5636"/><rect x="-126" y="-4" width="84" height="20" rx="10" fill="#7f4f31"/><rect x="-118" y="18" width="76" height="20" rx="10" fill="#8A5636"/><rect x="-74" y="30" width="52" height="22" rx="11" fill="#6f4229" transform="rotate(35 -74 30)"/></g></g>
    <g id="armB"><path class="sleeve" stroke="#161f1a" stroke-width="72" stroke-linecap="round" fill="none"/><g class="hand"><ellipse cx="-34" cy="6" rx="50" ry="38" fill="#86533A"/><rect x="-118" y="-26" width="76" height="20" rx="10" fill="#93603F"/><rect x="-126" y="-4" width="84" height="20" rx="10" fill="#8a5636"/><rect x="-118" y="18" width="76" height="20" rx="10" fill="#93603F"/><rect x="-74" y="30" width="52" height="22" rx="11" fill="#7A4A2E" transform="rotate(35 -74 30)"/></g></g>
    <!-- counter -->
    <rect x="0" y="1600" width="1080" height="70" fill="url(#marble)"/>
    <path d="M0 1625 C200 1612 380 1640 620 1618 S940 1630 1080 1615" stroke="#b9ab92" stroke-width="2" fill="none" opacity=".6"/>
    <rect x="0" y="1666" width="1080" height="6" fill="#E8A812"/>
    <rect x="0" y="1672" width="1080" height="248" fill="url(#front)"/>
    <!-- counter items -->
    <g transform="translate(70 1430)"><rect x="0" y="40" width="74" height="132" rx="16" fill="#E8A812"/><rect x="18" y="12" width="38" height="30" rx="6" fill="#0E3B2E"/><rect x="40" y="0" width="44" height="16" rx="5" fill="#0E3B2E"/><rect x="12" y="80" width="50" height="40" rx="6" fill="#FBF6EC" opacity=".85"/></g>
    <g transform="translate(180 1572)"><rect width="230" height="26" rx="10" fill="#1d2622"/><g fill="#1d2622"><rect x="10" y="22" width="7" height="22" rx="3"/><rect x="30" y="22" width="7" height="22" rx="3"/><rect x="50" y="22" width="7" height="22" rx="3"/><rect x="70" y="22" width="7" height="22" rx="3"/><rect x="90" y="22" width="7" height="22" rx="3"/><rect x="110" y="22" width="7" height="22" rx="3"/><rect x="130" y="22" width="7" height="22" rx="3"/><rect x="150" y="22" width="7" height="22" rx="3"/></g></g>
  </svg>

  <!-- phone, propped on the counter -->
  <div class="phone" id="phone" style="left:615px;top:810px;width:620px;height:1280px;transform-origin:0 0">
    <span class="badge" id="badge">1</span>
    <div class="screen lock">
      <div class="island"></div>
      <div class="sbar"><span></span><span class="batt"></span></div>
      <div class="clock"><small>Tuesday, October 28</small><b>2:14</b></div>
      <div class="notif" id="n1" style="top:520px">
        <div class="app"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 21l3.6-1.8c1.1.3 2.2.5 3.4.5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z" fill="#fff"/></svg></div>
        <div class="txt"><div class="top"><span>MESSAGES</span><span>now</span></div><b>Amina</b><p>Hi! Do you have any braid openings this week?</p></div>
      </div>
      <div class="unread" id="unread" style="top:790px">Unread · 1 min</div>
    </div>
  </div>
</div>

<div class="caption" id="cap">Your customers are <span class="hl">messaging you.</span></div>

<script type="module">
import { prog, ease, lerp, dust, caption, pop, buzz } from './kit.js';

const drift = dust(document.getElementById('bg'), 11);
const cap = caption(document.getElementById('cap'));
const world = document.getElementById('world');
const phone = document.getElementById('phone');
const n1 = document.getElementById('n1');
const badge = document.getElementById('badge');
const unread = document.getElementById('unread');
const sA = document.getElementById('strandA'), sB = document.getElementById('strandB');
const arms = ['armA', 'armB'].map((id) => document.getElementById(id));

/** The stylist's hands work the braid: two hands trading places on a steady rhythm. */
function hands(t) {
  const spots = [
    { sx: 1120, sy: 620, wx: 520, wy: 940, ph: 0 },
    { sx: 1140, sy: 820, wx: 540, wy: 1040, ph: Math.PI },
  ];
  spots.forEach((s, i) => {
    const w = t * 7 + s.ph;
    const x = s.wx + Math.sin(w) * 22, y = s.wy + Math.cos(w) * 30;
    const g = arms[i];
    g.querySelector('.sleeve').setAttribute('d', `M${s.sx} ${s.sy} Q${(s.sx + x) / 2 + 40} ${(s.sy + y) / 2 - 80} ${x + 30} ${y}`);
    g.querySelector('.hand').setAttribute('transform', `translate(${x} ${y}) rotate(${Math.sin(w) * 8 - 10})`);
    (i ? sB : sA).setAttribute('d', `M${420 + i * 20} ${960 + i * 40} Q${450 + i * 10} ${990 + i * 30} ${x - 110} ${y + 4}`);
  });
}

window.film = {
  duration: 4,
  frame(t) {
    drift(t);
    hands(t);
    // camera settles in
    const k = ease.out(prog(t, 0, 1.2));
    world.style.transform = `scale(${lerp(1.07, 1, k)})`;
    world.style.opacity = lerp(0.4, 1, k);

    // the message lands, the phone buzzes, nobody picks it up
    const sh = buzz(t, 1.0) + buzz(t, 1.5);
    phone.style.transform = `translateX(${sh}px) rotate(${-3 + sh * 0.15}deg) scale(.66)`;
    pop(n1, t, 1.0, 0.7);
    pop(badge, t, 1.15, 0.5);
    unread.style.opacity = ease.out(prog(t, 2.2, 0.5));
    cap(t, 0.25);
  },
};
</script>
</body>
</html>
